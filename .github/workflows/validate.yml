name: Validate levels

on:
  # Every PR runs this, so it can be a required status check on main.
  pull_request:
  push:
    branches: [main]
    paths:
      - 'levels/**'
      - 'content/**'
      - 'schema/**'
      - 'engine/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Unit tests (simulator)
        run: npm test

      - name: Validate all levels (schema + physics)
        run: npm run validate

      - name: Dry-run build
        run: npm run build
